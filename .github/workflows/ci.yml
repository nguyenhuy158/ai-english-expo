name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm check (Biome lint) -> pnpm test (selfcheck) -> pnpm build: bundle the
  # JS for iOS with Metro, catching broken imports/syntax without Xcode.
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-test: true
      run-build: true
